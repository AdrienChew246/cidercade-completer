name: Release Apps Script

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'dylan-dang/cidercade-completer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            previous="$(
              git show "${BEFORE_SHA}:package.json" 2>/dev/null \
                | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(s).version||"")}catch{}})' \
                || true
            )"
            if [ -n "$previous" ] && [ "$previous" = "$version" ]; then
              echo "package.json version unchanged (${version}); skipping."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Version ${previous:-?} -> ${version}"
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        if: steps.version.outputs.publish == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: bun run gs:build

      - name: Create release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" dist/cidercade-apps-script.js \
            --title "$TAG" \
            --generate-notes
